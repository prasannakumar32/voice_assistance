<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TMark Techs AI Voice Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="voice-app">
      <section class="assistant-card">
        <div class="brand-row">
          <div class="brand-mark" aria-hidden="true">T</div>
          <div class="brand-copy">
            <p class="eyebrow">TMark Techs</p>
            <h1>AI Voice Assistant</h1>
          </div>
        </div>

        <div class="brand-tag">Digital transformation for Microsoft-first businesses</div>

        <div class="hero-panel" aria-label="Voice assistant area">
          <div class="glow-ring" aria-hidden="true"></div>
          <div class="orb orb-one" aria-hidden="true"></div>
          <div class="orb orb-two" aria-hidden="true"></div>

          <button id="start" class="mic-button" type="button" aria-label="Start voice assistant">
            <span class="mic-icon" aria-hidden="true">◉</span>
            <span class="mic-label">Start speaking</span>
          </button>
        </div>

        <div class="service-pills" aria-label="Service categories">
          <span>SharePoint</span>
          <span>Microsoft 365</span>
          <span>Azure</span>
          <span>Power Platform</span>
        </div>

        <div class="controls-row">
          <button id="stop" class="stop-button" type="button" disabled>Stop</button>
        </div>

        <div class="status-panel">
          <div id="status" class="status" role="status" aria-live="polite">Ready</div>
        </div>

        <div id="transcript" class="transcript">Ask about SharePoint, Microsoft 365, Azure, Power Platform, automation, and AI strategy.</div>
      </section>
    </main>

    <script src="/app.js" defer></script>
  </body>
</html>
